name: stripe
description: "Stripe — typed via a curated, vendored OpenAPI 3 spec covering the high-traffic billing surface (customers, subscriptions, invoices, charges, refunds, payouts, balance, payment links). OAuth2 via Stripe Connect. Bundles a `stripe` Agent Skill that teaches the workflow patterns (search-by-customer, MRR aggregation, dunning state, idempotency, money-as-integer-cents)."
